{{- if not .Values.clusterName }}
{{- fail "clusterName is required: set --set clusterName=<your-cluster>" }}
{{- end }}
{{- include "karpenter-hetzner.requireInt" (dict "value" .Values.replicas "name" "replicas" "allowZero" true) }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: karpenter-provider-hetzner
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: karpenter-provider-hetzner
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  replicas: {{ .Values.replicas | int }}
  selector:
    matchLabels:
      app.kubernetes.io/name: karpenter-provider-hetzner
  template:
    metadata:
      labels:
        app.kubernetes.io/name: karpenter-provider-hetzner
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      serviceAccountName: {{ .Values.serviceAccount.name }}
      {{- with .Values.priorityClassName }}
      priorityClassName: {{ . | quote }}
      {{- end }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: controller
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- with .Values.command }}
          command:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.args }}
          args:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          env:
            - name: HCLOUD_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.auth.secretRef.name }}
                  key: {{ .Values.auth.secretRef.key }}
            - name: CLUSTER_NAME
              value: {{ .Values.clusterName | quote }}
            {{- if .Values.instanceGarbageCollection.disabled }}
            - name: DISABLE_INSTANCE_GARBAGE_COLLECTION
              value: "true"
            {{- end }}
            - name: METRICS_PORT
              value: {{ .Values.metrics.port | quote }}
            - name: HEALTH_PROBE_PORT
              value: {{ .Values.healthProbe.port | quote }}
          ports:
            - name: http-metrics
              containerPort: {{ .Values.metrics.port }}
            - name: http-health
              containerPort: {{ .Values.healthProbe.port }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: http-health
            initialDelaySeconds: 30
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /readyz
              port: http-health
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop: ["ALL"]
