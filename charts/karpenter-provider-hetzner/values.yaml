replicas: 1

image:
  repository: ghcr.io/paperclipinc/karpenter-provider-hetzner
  # Empty tracks the chart's appVersion, which the release workflow sets from
  # the git tag and publishes as a matching image tag. Pinning "latest" here
  # meant a released chart floated onto whatever was newest.
  tag: ""
  pullPolicy: IfNotPresent

auth:
  secretRef:
    name: hcloud-token
    key: token

serviceAccount:
  create: true
  name: karpenter

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 256Mi

# Pod scheduling & placement. All empty by default — opt in via values.
nodeSelector: {}
affinity: {}
tolerations: []
topologySpreadConstraints: []
imagePullSecrets: []
priorityClassName: ""

# PodDisruptionBudget for voluntary-disruption safety (e.g. node drains). Enable
# when running replicas > 1. Set minAvailable OR maxUnavailable (integers only,
# mutually exclusive — no percentages); leave both unset to default to
# maxUnavailable: 1, which never blocks drains (a single replica can still be
# evicted — run replicas >= 2 to keep the controller available).
podDisruptionBudget:
  enabled: false
  # minAvailable: 1   # must be < replicas (so needs replicas >= 2)
  # maxUnavailable: 1

# Container launch overrides. `args` passes flags to the controller (e.g.
# --log-level, --feature-gates); `command` replaces the entrypoint binary (rarely
# needed — the hardcoded probes expect /healthz and /readyz).
command: []
args: []

# Required: scopes managed servers so multiple clusters can share one Hetzner project.
clusterName: ""

metrics:
  port: 8080
healthProbe:
  port: 8081

# serviceMonitor wires a Prometheus Operator ServiceMonitor to the metrics port.
# Requires the prometheus.io/operator CRD to be installed in the cluster.
serviceMonitor:
  # enabled: set true to deploy the Service + ServiceMonitor resources.
  enabled: false
  # interval: how often Prometheus scrapes the metrics endpoint.
  interval: 30s
  # additionalLabels: extra labels to add to the ServiceMonitor (e.g. for a
  # Prometheus Operator instance selector).
  additionalLabels: {}
